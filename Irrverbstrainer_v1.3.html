<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col items-center py-10 px-4 transition-colors duration-300">

    <header class="w-full max-w-4xl flex justify-between items-start mb-8">
        <div class="text-left">
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-900 dark:text-indigo-400 mb-2 tracking-tight">Irregular Verbs</h1>
            <p class="text-slate-500 dark:text-slate-400">Trainiere unregelmässige englische Verben effektiv.</p>
        </div>
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors focus:outline-none">
            <svg id="icon-sun" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="icon-moon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </header>

    <main class="w-full max-w-4xl bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden relative min-h-[400px] flex flex-col fade-in transition-colors duration-300">
        
        <div id="view-start" class="flex-1 flex flex-col items-center justify-center p-8 text-center hidden">
            <div class="mb-6 bg-indigo-50 dark:bg-indigo-900/30 p-6 rounded-full inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-indigo-600 dark:text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-4 dark:text-white">Bereit für die nächste Session?</h2>
            
            <div class="w-full max-w-md bg-slate-100 dark:bg-slate-700 rounded-lg p-4 mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-medium text-slate-700 dark:text-slate-300">Dein Fortschritt:</span>
                    <span id="progress-text" class="font-bold text-indigo-600 dark:text-indigo-400">0 / 0</span>
                </div>
                <div class="w-full bg-slate-300 dark:bg-slate-600 rounded-full h-3">
                    <div id="progress-bar" class="bg-indigo-500 dark:bg-indigo-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="showManager()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-3 px-8 rounded-xl shadow transition-colors focus:outline-none">
                    Verb-Manager
                </button>
                <button onclick="startCycle()" id="btn-start" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1 focus:outline-none">
                    Session starten
                </button>
            </div>
        </div>

        <div id="view-manager" class="flex-1 flex flex-col p-6 md:p-8 hidden h-full max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold dark:text-white">Verb-Manager</h2>
                <button onclick="returnToStart()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white px-4 py-2 rounded-lg font-semibold transition-colors">
                    Zurück
                </button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2" id="manager-list"></div>
        </div>

        <div id="view-train" class="flex-1 flex flex-col p-6 md:p-10 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-700 dark:text-slate-200">Fülle die Felder aus (Kleinschreibung)</h2>
                <span class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full">
                    Noch offen: <span id="cycle-count">0</span>
                </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Infinitive</label>
                    <input type="text" id="input-inf" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" class="verb-input bg-white text-black border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Past Simple</label>
                    <input type="text" id="input-past" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" class="verb-input bg-white text-black border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Past Participle</label>
                    <input type="text" id="input-pp" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" class="verb-input bg-white text-black border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Übersetzung</label>
                    <input type="text" id="input-ger" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" class="verb-input bg-white text-black border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
            </div>

            <div class="mt-auto flex justify-end">
                <button onclick="checkAnswers()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-md transition-colors">
                    Prüfen
                </button>
            </div>
        </div>

        <div id="view-feedback" class="flex-1 flex flex-col p-6 md:p-10 hidden">
            <div id="feedback-header" class="mb-6 flex items-center gap-3"></div>
            <p id="feedback-message" class="text-slate-600 dark:text-slate-300 mb-6"></p>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8" id="feedback-grid"></div>
            <div id="feedback-actions" class="mt-auto flex flex-col sm:flex-row justify-end gap-4"></div>
        </div>

        <div id="view-end" class="flex-1 flex flex-col items-center justify-center p-8 text-center hidden">
            <div class="mb-6 bg-green-50 dark:bg-green-900/30 p-6 rounded-full inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-4 dark:text-white">Cycle abgeschlossen!</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="returnToStart()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-3 px-6 rounded-xl transition-colors focus:outline-none">Übersicht</button>
                <button onclick="startCycle()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform focus:outline-none">Weiter</button>
            </div>
        </div>
    </main>

    <script>
        // --- DATA (Alle "ß" durch "ss" ersetzt) ---
        const verbDb = [
            { id: 1, inf: ['be'], past: ['was/were', 'was', 'were'], pp: ['been'], ger: ['sein'] },
            { id: 2, inf: ['become'], past: ['became'], pp: ['become'], ger: ['werden'] },

            { id: 31, inf: ['forget'], past: ['forgot'], pp: ['forgotten'], ger: ['vergessen'] },
            { id: 32, inf: ['freeze'], past: ['froze'], pp: ['frozen'], ger: ['frieren'] },

            { id: 34, inf: ['give'], past: ['gave'], pp: ['given'], ger: ['geben'] },
            { id: 35, inf: ['go'], past: ['went'], pp: ['gone', 'been'], ger: ['gehen'] },
            { id: 36, inf: ['grow'], past: ['grew'], pp: ['grown'], ger: ['wachsen'] },

            { id: 45, inf: ['lay'], past: ['laid'], pp: ['laid'], ger: ['legen'] },
            { id: 46, inf: ['learn'], past: ['learnt', 'learned'], pp: ['learnt', 'learned'], ger: ['lernen'] },

            { id: 54, inf: ['mean'], past: ['meant'], pp: ['meant'], ger: ['meinen', 'bedeuten'] },

            { id: 59, inf: ['read'], past: ['read'], pp: ['read'], ger: ['lesen'] },
            { id: 60, inf: ['rebuild'], past: ['rebuilt'], pp: ['rebuilt'], ger: ['wieder aufbauen'] },
            { id: 61, inf: ['rewrite'], past: ['rewrote'], pp: ['rewritten'], ger: ['umschreiben'] },
            { id: 62, inf: ['ride'], past: ['rode'], pp: ['ridden'], ger: ['reiten'] },
            { id: 63, inf: ['ring'], past: ['rang'], pp: ['rung'], ger: ['klingeln'] },

            { id: 65, inf: ['say'], past: ['said'], pp: ['said'], ger: ['sagen'] },
            { id: 66, inf: ['see'], past: ['saw'], pp: ['seen'], ger: ['sehen'] },
            { id: 67, inf: ['sell'], past: ['sold'], pp: ['sold'], ger: ['verkaufen'] },
            { id: 68, inf: ['send'], past: ['sent'], pp: ['sent'], ger: ['senden'] },
            { id: 69, inf: ['set'], past: ['set'], pp: ['set'], ger: ['setzen'] },

            { id: 79, inf: ['speak'], past: ['spoke'], pp: ['spoken'], ger: ['sprechen'] },
            { id: 80, inf: ['spell'], past: ['spelt', 'spelled'], pp: ['spelt', 'spelled'], ger: ['buchstabieren'] },
            { id: 81, inf: ['spend'], past: ['spent'], pp: ['spent'], ger: ['ausgeben'] },
            { id: 82, inf: ['stand'], past: ['stood'], pp: ['stood'], ger: ['stehen'] },
            { id: 83, inf: ['steal'], past: ['stole'], pp: ['stolen'], ger: ['stehlen'] },
            { id: 84, inf: ['stick'], past: ['stuck'], pp: ['stuck'], ger: ['kleben'] },
            { id: 85, inf: ['swim'], past: ['swam'], pp: ['swum'], ger: ['schwimmen'] },
            { id: 86, inf: ['take'], past: ['took'], pp: ['taken'], ger: ['nehmen'] },
            { id: 87, inf: ['teach'], past: ['taught'], pp: ['taught'], ger: ['lehren'] },
            { id: 88, inf: ['tell'], past: ['told'], pp: ['told'], ger: ['erzählen'] },
            { id: 89, inf: ['think'], past: ['thought'], pp: ['thought'], ger: ['denken'] },
            { id: 90, inf: ['throw'], past: ['threw'], pp: ['thrown'], ger: ['werfen'] },
            { id: 91, inf: ['understand'], past: ['understood'], pp: ['understood'], ger: ['verstehen'] },
            { id: 92, inf: ['wake'], past: ['woke'], pp: ['woken'], ger: ['aufwachen'] },
            { id: 93, inf: ['wear'], past: ['wore'], pp: ['worn'], ger: ['tragen'] },
            { id: 94, inf: ['win'], past: ['won'], pp: ['won'], ger: ['gewinnen'] },
            { id: 95, inf: ['write'], past: ['wrote'], pp: ['written'], ger: ['schreiben'] }
        ];

        let permanentlyLearned = new Set(JSON.parse(localStorage.getItem('learnedVerbs') || '[]'));
        let currentCycleVerbs = [];
        let currentVerb = null;
        let revealedIndex = -1;
        const VIEWS = { START: 'view-start', MANAGER: 'view-manager', TRAIN: 'view-train', FEEDBACK: 'view-feedback', END: 'view-end' };
        const inputs = [document.getElementById('input-inf'), document.getElementById('input-past'), document.getElementById('input-pp'), document.getElementById('input-ger')];
        const labels = ['Infinitive', 'Past Simple', 'Past Participle', 'Übersetzung'];

        function initApp() {
            if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
            updateStartScreen();
            showView(VIEWS.START);
            inputs.forEach(input => input.addEventListener('keypress', (e) => e.key === 'Enter' && checkAnswers()));
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
        }

        function showManager() { renderManagerList(); showView(VIEWS.MANAGER); }

        function renderManagerList() {
            const list = document.getElementById('manager-list');
            list.innerHTML = '';
            verbDb.forEach(v => {
                const isL = permanentlyLearned.has(v.id);
                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-4 mb-2 rounded-xl border ${isL ? 'bg-green-50 dark:bg-green-900/20' : 'bg-slate-50 dark:bg-slate-700'}`;
                row.innerHTML = `<div><p class="font-bold">${v.inf[0]}</p><p class="text-xs text-slate-500">${v.ger[0]}</p></div>`;
                const b = document.createElement('button');
                b.className = "px-3 py-1 rounded text-sm font-bold " + (isL ? "bg-slate-200 dark:bg-slate-600" : "bg-green-100 dark:bg-green-800 text-green-700");
                b.innerText = isL ? "Degradieren" : "Meistern";
                b.onclick = () => { isL ? permanentlyLearned.delete(v.id) : permanentlyLearned.add(v.id); saveProgress(); renderManagerList(); };
                row.appendChild(b);
                list.appendChild(row);
            });
        }

        function updateStartScreen() {
            const total = verbDb.length;
            const learned = permanentlyLearned.size;
            document.getElementById('progress-text').innerText = `${learned} / ${total}`;
            document.getElementById('progress-bar').style.width = `${Math.round((learned/total)*100)}%`;
        }

        function startCycle() {
            const avail = verbDb.filter(v => !permanentlyLearned.has(v.id));
            if (!avail.length) return alert("Alles gelernt!");
            currentCycleVerbs = avail.sort(() => Math.random() - 0.5);
            nextVerb();
        }

        function nextVerb() {
            if (!currentCycleVerbs.length) return showView(VIEWS.END);
            currentVerb = currentCycleVerbs[0];
            revealedIndex = Math.floor(Math.random() * 4);
            document.getElementById('cycle-count').innerText = currentCycleVerbs.length;
            renderInputs();
            showView(VIEWS.TRAIN);
        }

        function renderInputs() {
            const props = ['inf', 'past', 'pp', 'ger'];
            inputs.forEach((input, i) => {
                input.value = i === revealedIndex ? currentVerb[props[i]][0] : '';
                input.disabled = i === revealedIndex;
                // ERZWUNGEN: Hintergrund hell, Text schwarz
                const baseClass = "verb-input border-2 rounded-xl px-4 py-3 w-full text-black ";
                const colorClass = (i === revealedIndex) ? "bg-indigo-50 border-indigo-200 font-bold" : "bg-white border-slate-200";
                input.className = baseClass + colorClass;
            });
            setTimeout(() => inputs.find(i => !i.disabled)?.focus(), 50);
        }

        function checkAnswers() {
            const props = ['inf', 'past', 'pp', 'ger'];
            let correct = true;
            const res = inputs.map((input, i) => {
                if (i === revealedIndex) return { val: input.value, ok: true, rev: true };
                const ok = currentVerb[props[i]].map(v => v.toLowerCase()).includes(input.value.trim().toLowerCase());
                if (!ok) correct = false;
                return { val: input.value.trim(), ok, rev: false, ans: currentVerb[props[i]] };
            });
            renderFeedback(correct, res);
        }

        function renderFeedback(ok, res) {
            const grid = document.getElementById('feedback-grid');
            grid.innerHTML = '';
            res.forEach((r, i) => {
                const box = document.createElement('div');
                // Feedback-Boxen bleiben im Dark Mode angepasst, aber Text im Input-Stil bleibt dunkel
                box.className = `p-3 rounded-xl border-2 ${r.rev ? 'bg-indigo-50 text-black' : r.ok ? 'bg-green-50 border-green-400 text-black' : 'bg-red-50 border-red-400 text-black'}`;
                box.innerHTML = `<p class="text-xs uppercase text-slate-400">${labels[i]}</p><p class="font-bold">${r.val || '?'}</p>`;
                if (!r.ok && !r.rev) box.innerHTML += `<p class="text-xs text-green-700 mt-1 font-bold">Lösung: ${r.ans.join('/')}</p>`;
                grid.appendChild(box);
            });
            const act = document.getElementById('feedback-actions');
            if (ok) {
                act.innerHTML = `<button onclick="handle(false)" class="bg-slate-200 dark:bg-slate-700 p-3 rounded-xl font-bold">Cycle weiter</button>
                                 <button onclick="handle(true)" class="bg-green-600 text-white p-3 rounded-xl font-bold">Permanent speichern</button>`;
            } else {
                act.innerHTML = `<button onclick="handleWrong()" class="bg-indigo-600 text-white p-3 rounded-xl font-bold w-full">Verstanden</button>`;
            }
            showView(VIEWS.FEEDBACK);
        }

        function handle(perm) {
            const v = currentCycleVerbs.shift();
            if (perm) permanentlyLearned.add(v.id);
            saveProgress();
            nextVerb();
        }

        function handleWrong() {
            currentCycleVerbs.push(currentCycleVerbs.shift());
            nextVerb();
        }

        function saveProgress() { localStorage.setItem('learnedVerbs', JSON.stringify([...permanentlyLearned])); updateStartScreen(); }
        function returnToStart() { updateStartScreen(); showView(VIEWS.START); }
        function showView(v) { Object.values(VIEWS).forEach(id => document.getElementById(id).classList.toggle('hidden', id !== v)); }

        initApp();
    </script>
</body>
</html>
